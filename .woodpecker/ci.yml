when:
  - event: [push, pull_request, manual]
    branch: main

steps:
  - name: install
    image: node:24-bookworm
    commands:
      - npm ci

  - name: lint-and-format
    image: node:24-bookworm
    commands:
      - npm run format:check

  - name: type-check
    image: node:24-bookworm
    commands:
      - npm run type-check

  - name: test
    image: node:24-bookworm
    commands:
      # Containers do not share installed system packages with earlier steps.
      - apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - npm run test:run
