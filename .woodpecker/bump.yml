# Start a manual pipeline on main with RELEASE=true and optional BUMP_TYPE.
when:
  - event: manual
    branch: main
    evaluate: 'RELEASE == "true"'

steps:
  - name: version-bump
    image: node:26-bookworm
    environment:
      BYPASS_TOKEN:
        from_secret: bypass_token
      # renovate: datasource=github-releases depName=orhun/git-cliff
      GIT_CLIFF_VERSION: "2.14.2"
      # sha256 of git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz.
      # renovate updates only the version line: set this alongside each bump
      # (bump.sh hard-fails on a mismatch, and its local defaults must match).
      GIT_CLIFF_SHA256: fa21e2fc70046fcfd0e43e5e4613873ab799aff3d9dc8559c00d31b270e417d0
    commands:
      - sh .woodpecker/scripts/bump.sh
