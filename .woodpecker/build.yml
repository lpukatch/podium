when:
  - event: [push, pull_request]
    branch: main
  - event: manual
    branch: main
    evaluate: 'RELEASE != "true"'
  - event: tag
    ref: refs/tags/v*

steps:
  - name: metadata
    image: node:26-bookworm
    environment:
      REGISTRY:
        from_secret: registry
      IMAGE_NAME:
        from_secret: image_name
    commands:
      - node .woodpecker/scripts/build-metadata.cjs

  # Allowlist this exact image with WOODPECKER_PLUGINS_PRIVILEGED on the server.
  # Do not add commands here: that would override the plugin entrypoint.
  - name: build-and-publish
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    settings:
      env_file: .woodpecker-build.env
      # Explicit parser splits newline-delimited tags; implicit .tags loading does not.
      tags_file: .tags
      registry:
        from_secret: registry
      username:
        from_secret: registry_username
      password:
        from_secret: registry_token
      platforms: linux/amd64
      provenance: false
      build_args_from_env:
        - PODIUM_BUILD_VERSION
      labels:
        - org.opencontainers.image.title=podium
        - org.opencontainers.image.description=Provider-aware stream checker and reorderer for Dispatcharr

  # Scan what was just published, straight from the registry: the buildx plugin
  # builds inside its own DinD container, so there is no local image for this
  # step to read. Edge builds scan :main on every push, so a release cut
  # inherits an already-scanned commit; the tag pipeline re-scans as the final
  # gate before :latest moves. PR pipelines publish nothing, so they skip this.
  #
  # --ignore-unfixed: an OS CVE with no backported fix (the reason the base
  # image moved to trixie) would otherwise hold CI red forever. Accepted
  # findings go in .trivyignore, committed and reviewable, never in someone's
  # head.
  - name: image-scan
    image: aquasec/trivy:0.76.2
    when:
      - event: [push, manual, tag]
    environment:
      REGISTRY:
        from_secret: registry
      IMAGE_NAME:
        from_secret: image_name
      TRIVY_USERNAME:
        from_secret: registry_username
      TRIVY_PASSWORD:
        from_secret: registry_token
      TRIVY_CACHE_DIR: /tmp/trivy-cache
    commands:
      - case "$$CI_PIPELINE_EVENT" in tag) REF="$${CI_COMMIT_TAG#v}" ;; *) REF=main ;; esac
      # The table goes to a file (save-scan-report below publishes it) and is
      # then printed into this step's log either way, so findings are visible
      # even when the gate is red. trivy writes the report before exiting
      # nonzero; || RC=$? keeps that exit code through the file handling.
      # One physical line: YAML folds a multi-line plain scalar into a single
      # line, and a trailing backslash next to the folding space becomes a
      # stray positional argument ("multiple targets cannot be specified").
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --ignorefile .trivyignore --format table --output trivy-report.txt "$$REGISTRY/$$IMAGE_NAME:$REF" || RC=$$?
      - cat trivy-report.txt
      - exit $${RC:-0}

  # Woodpecker has no pipeline attachments, so the report is published to the
  # upstream Forgejo's generic package registry instead: one report per commit
  # at <forgejo>/api/packages/<owner>/generic/podium-trivy/<sha>/trivy-<ref>.txt
  # -- the durable record that outlives log retention.
  #
  # Runs even after a failed gate (status: [success, failure]) -- that is
  # exactly the report worth keeping -- and failure: ignore so a hiccup here
  # never masks the gate's verdict. The Forgejo host is derived from the
  # runtime clone URL, never committed: this file ships to the public mirror.
  - name: save-scan-report
    image: curlimages/curl:8.23.0
    when:
      - event: [push, manual, tag]
        status: [success, failure]
    failure: ignore
    environment:
      PACKAGE_TOKEN:
        from_secret: package_token
    commands:
      - test -f trivy-report.txt
      - case "$$CI_PIPELINE_EVENT" in tag) REF="$${CI_COMMIT_TAG#v}" ;; *) REF=main ;; esac
      - BASE=$(printf '%s\n' "$$CI_REPO_CLONE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
      - URL="$$BASE/api/packages/$$CI_REPO_OWNER/generic/$${CI_REPO_NAME}-trivy/$$CI_COMMIT_SHA/trivy-$$REF.txt"
      # Single-quoted YAML scalar: plain scalars split on ": ", so the
      # Authorization header would otherwise parse as a mapping, not a string.
      - 'curl -fsS --retry 3 -H "Authorization: token $$PACKAGE_TOKEN" --upload-file trivy-report.txt "$$URL"'
      - echo "Report saved to $$URL"
