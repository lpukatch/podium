name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test
        # ffmpeg so the probe tests exercise the real ffprobe path rather than
        # only the parser.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          npm run test:run

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only -- publishing is publish.yml's job.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: podium:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
