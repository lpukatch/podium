name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the commit-subject check walks origin/main..HEAD.
          fetch-depth: 0

      - name: Commit subjects
        if: github.event_name == 'pull_request'
        run: node .woodpecker/scripts/check-commit-subjects.cjs

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      # Same policy as the upstream Woodpecker pipeline: production closure
      # only (devDependencies never ship), HIGH is the gate.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test
        # ffmpeg so the probe tests exercise the real ffprobe path rather than
        # only the parser. Coverage table lands in the run log; thresholds
        # follow once main's baseline is visible.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          npm run test:coverage

  docker:
    # Publish builds on main; CI only needs to validate PR images.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build only -- publishing is publish.yml's job.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: podium:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
