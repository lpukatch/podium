name: Publish

# Two different things, deliberately kept apart:
#
#   push to main  -> ghcr.io/...:main       an edge image, for tracking main
#   tag v*        -> :X.Y.Z :X.Y :latest    a release, plus a GitHub Release
#
# `latest` only ever moves on a tag, so pulling `latest` gets a version somebody
# chose to cut rather than whatever landed on main last.
#
# Tags arrive here by mirror from the upstream Forgejo repo, which is where
# version bumping lives. Nothing in this repo writes commits: a mirror push is a
# force push, so anything committed here would be overwritten.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release
      packages: write # push to ghcr

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=podium
            org.opencontainers.image.description=Provider-aware stream checker and reorderer for Dispatcharr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # amd64 only: an arm64 pass costs a full QEMU-emulated Next.js build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Skips the attestation manifest, which otherwise shows up on the
          # packages page as an "unknown/unknown" platform entry.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub's own generated notes are built from merged pull requests, and
      # this repo has none: it is a mirror, the PRs live upstream on Forgejo,
      # and a mirror push is a force push. So the generated section came out
      # empty and every release read as the docker pull line and nothing else.
      # The commits are all here, though, so write the changelog from those.
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Walk back from the tagged commit's *parent*, or describe would
          # answer with the tag being released and the range would be empty.
          PREV=$(git describe --tags --abbrev=0 --match "v*" "${TAG}^" 2>/dev/null || true)
          {
            echo '```sh'
            # The image is tagged from the semver, which has no leading v --
            # `docker pull ...:v1.2.0` is not a tag that exists.
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${TAG#v}"
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="${TAG}"; fi
            # A merge commit repeats the subject of the branch it merges and the
            # release commit is bookkeeping, so neither earns a line of its own.
            git log "$RANGE" --no-merges --pretty="- %s (%h)" \
              | grep -v '^- chore(release):' \
              || echo "- no changes"
          } > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # body_path wins over body, and generate_release_notes appends
          # GitHub's section (the Full Changelog compare link) after it.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
