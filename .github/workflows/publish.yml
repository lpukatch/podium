name: Publish

# Two different things, deliberately kept apart:
#
#   push to main  -> ghcr.io/...:main       an edge image, for tracking main
#   tag v*        -> :X.Y.Z :X.Y :latest    a release, plus a GitHub Release
#
# `latest` only ever moves on a tag, so pulling `latest` gets a version somebody
# chose to cut rather than whatever landed on main last.
#
# Tags arrive here by mirror from the upstream Forgejo repo, which is where
# version bumping lives. Nothing in this repo writes commits: a mirror push is a
# force push, so anything committed here would be overwritten.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release
      packages: write # push to ghcr

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=podium
            org.opencontainers.image.description=Provider-aware stream checker and reorderer for Dispatcharr

      # What the app itself reports as its version; must match the Forgejo
      # build workflow. A tag build gets the released number, a :main edge
      # build gets that number plus the short commit sha.
      - name: App build version
        run: |
          v="$(node -p "require('./package.json').version")"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) v="${v}+g$(git rev-parse --short HEAD)" ;;
          esac
          echo "PODIUM_BUILD_VERSION=${v}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          # amd64 only: an arm64 pass costs a full QEMU-emulated Next.js build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PODIUM_BUILD_VERSION=${{ env.PODIUM_BUILD_VERSION }}
          # Skips the attestation manifest, which otherwise shows up on the
          # packages page as an "unknown/unknown" platform entry.
          provenance: false
          # Export with Docker media types, not OCI ones: Unraid's Docker tab
          # fails to parse an OCI-typed manifest and shows the template as
          # "not available". Combined with push: true this stays a single
          # export -- buildx sets push on an explicit image export rather than
          # adding a second registry one.
          outputs: type=image,oci-mediatypes=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gate as the Woodpecker image-scan step (see .woodpecker/build.yml):
      # edge builds scan :main on every push so a tag cut inherits a
      # scanned commit, and the tag pipeline re-scans as the final gate
      # before :latest moves. Runs after push because the image only exists
      # in ghcr; the docker login above is what lets trivy pull it.
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: '1'
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      # CHANGELOG.md is written by the release commit (git-cliff; cliff.toml is
      # the template and documents the heading contract this depends on). The
      # release body is this tag's section read back out of that file, so the
      # changelog users read in the repo is the changelog they get on
      # releases. generate_release_notes still appends GitHub's section (the
      # compare link) after it.
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            echo '```sh'
            # The image is tagged from the semver, which has no leading v --
            # `docker pull ...:v1.2.0` is not a tag that exists.
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${TAG#v}"
            echo '```'
            echo
            # Exact-line match, so "## v1.1" cannot stop at "## v1.18".
            awk -v h="## ${TAG#v}" '$0 == h {f = 1; next} f && /^## /{exit} f' \
              CHANGELOG.md > section.md
            if [ -s section.md ]; then
              cat section.md
            else
              # Fallback for tags that predate the changelog: flat commit list,
              # merges and release bookkeeping excluded.
              echo "## Changes"
              echo
              # Walk back from the tagged commit's *parent*, or describe would
              # answer with the tag being released and the range would be empty.
              PREV=$(git describe --tags --abbrev=0 --match "v*" "${TAG}^" 2>/dev/null || true)
              if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="${TAG}"; fi
              git log "$RANGE" --no-merges --pretty="- %s (%h)" \
                | grep -v '^- chore(release):' \
                || echo "- no changes"
            fi
          } > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          # body_path wins over body, and generate_release_notes appends
          # GitHub's section (the Full Changelog compare link) after it.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
