# Release notes, generated from Conventional Commits. Two consumers:
# .woodpecker/scripts/bump.sh writes each release's section on top of
# CHANGELOG.md (`--unreleased --tag vX --prepend`), and the GitHub release
# body in publish.yml is read back out of that file -- so this file is the
# single source of truth for release notes.
#
# Contracts other files depend on -- change them together:
#   * The [changelog] header must byte-match the head of CHANGELOG.md:
#     --prepend keeps only the matching block and sinks anything else in the
#     file below the generated sections.
#   * Every section heading is exactly "## " + the tag (## v1.18.0), no date:
#     publish.yml extracts the release section with an exact-line match, so a
#     date suffix would break it (and "## v1.1" must not match "## v1.18").
#
# Grouping follows what users read: breaking changes first, then features,
# fixes, performance, dependency updates. Refactor/docs/ci/test work and the
# forge's merge subjects are internal and dropped (the WARN about skipped
# commits in the pipeline log is those drops working as intended).

[changelog]
header = """
# Changelog

All notable changes to Podium, generated by git-cliff from Conventional
Commits on each release. Do not edit sections by hand -- fix the commit
messages instead; the next release regenerates from them.

"""
body = """
{%- if commits | length > 0 -%}
## {{ version }}
{%- set order = ["⚠ BREAKING CHANGES", "Features", "Bug Fixes", "Performance", "Dependency updates"] %}
{%- for name in order %}
{%- set group_commits = commits | filter(attribute="group", value=name) %}
{%- if group_commits | length > 0 %}

### {{ name }}
{%- for commit in group_commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.breaking %} **BREAKING**{% endif %} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{%- endif %}
{%- endfor %}
{%- endif %}
"""

[git]
conventional_commits = true
filter_unconventional = true
sort_commits = "oldest"
tag_pattern = "v[0-9]+\\.[0-9]+.*"
# Footer-based breaking changes (BREAKING CHANGE: in the body) keep their
# type group but are marked; bang-style subjects (!:) get the section above.
protect_breaking_commits = true
commit_parsers = [
  { message = "^[a-z]+(\\([\\w./-]+\\))?!:", group = "⚠ BREAKING CHANGES" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^chore\\(deps", group = "Dependency updates" },
]
# Everything else -- chore, docs, ci, test, refactor, merges -- is filtered.
filter_commits = true
