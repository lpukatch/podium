name: Version Bump

# Deliberately manual. This used to run on every push to main, which meant every
# merged dependency bump cut a release and moved `latest` -- 52 tags in the first
# few months. Releasing is now a decision somebody makes.
#
# The heavy lifting is .ci/scripts/bump.sh, shared with local releases
# (`npm run release:bump`). It derives the bump from Conventional Commit
# subjects, updates both package files, generates CHANGELOG.md with git-cliff
# (installed from the mise.toml pin), commits, and atomically pushes the
# release commit and annotated tag -- which then triggers build.yml and, after
# mirroring, the GitHub release workflow.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

# Validation already ran on this SHA; a release pipeline that follows a manual
# one anyway would just serialize behind it.
concurrency:
  group: image-publication
  cancel-in-progress: false

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BYPASS_TOKEN }}
          # Without this the checkout is a detached HEAD at the pushed SHA, so
          # the release commit below never advances local main and the push
          # sends a stale ref.
          ref: main

      # mise rather than jdx/mise-action: the runner resolves `uses:` through
      # the forge's action mirror, which does not carry that action, so it is
      # installed directly -- checksummed, the way bump.sh used to install
      # git-cliff itself.
      - name: Install mise
        env:
          # renovate: datasource=github-releases depName=jdx/mise
          MISE_VERSION: "2026.11.6"
          # sha256 of mise-v${MISE_VERSION}-linux-x64. renovate updates only the
          # version line: set this alongside each bump (install-mise.sh
          # hard-fails on a mismatch).
          MISE_SHA256: 5fb74f80aab81e0a5ca20eb6414cc69b78ae0cab1deaeb521572ed26d8d4a6e3
        run: sh .ci/scripts/install-mise.sh

      # node and git-cliff from the mise.toml pin, the same versions local
      # releases resolve.
      - name: Install pinned tools
        run: mise install

      - name: Version bump
        env:
          # These adapt the Actions runtime to the contract bump.sh (written for
          # the previous Woodpecker pipeline) expects. CI_REPO_CLONE_URL must use
          # HTTPS for the release script's token authentication.
          BYPASS_TOKEN: ${{ secrets.BYPASS_TOKEN }}
          RELEASE: 'true'
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          CI_PIPELINE_EVENT: manual
          CI_COMMIT_BRANCH: main
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_REPO_CLONE_URL: ${{ github.server_url }}/${{ github.repository }}
        # Under mise exec so bump.sh's `node` and `git-cliff` resolve to the
        # pinned installs rather than the runner's system node.
        run: mise exec -- sh .ci/scripts/bump.sh
