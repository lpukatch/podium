name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # The mise release the mise-action step installs. The action itself is
  # SHA-pinned below; renovate's annotation manager bumps this line like every
  # other *_VERSION pin.
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: "2026.11.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the commit-subject check walks origin/main..HEAD.
          fetch-depth: 0

      # Tool pins live in mise.toml (node for the whole job, git-cliff for the
      # release workflow); this installs them and puts them on PATH. Pinned to
      # the action's commit the way the GitHub mirror pins its actions, with
      # MISE_VERSION pinning which mise release the action installs. Replaces
      # setup-node: node now comes from mise.toml, so every node step below --
      # commit subjects included, which previously ran on the runner's
      # whatever-version -- uses the same one.
      - name: Set up tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Commit subjects
        if: github.event_name == 'pull_request'
        run: node .ci/scripts/check-commit-subjects.cjs

      # setup-node's `cache: npm`, kept as an explicit step now that node comes
      # from mise: tarball cache keyed on the lockfile, same as before.
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: |
          node --test .ci/scripts/*.test.cjs
          npm ci

      # The shipped closure only: the standalone server traces production
      # dependencies, so devDependencies never reach an image -- auditing them
      # gates on noise. HIGH is the bar: moderate findings would train the red
      # pipeline to be ignored, and renovate lands the rest within days.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Forgejo has no server-side secret scanning, so the pipeline is the
      # substitute: the GitHub mirror is public and syncs every commit, meaning a
      # token that lands on main is exposed within one sync. Scan the full
      # history (fetch-depth: 0 above) so a secret from an older branch is
      # caught too. `gitleaks git` exits nonzero on any finding; accepted false
      # positives are fingerprinted in .gitleaksignore.
      #
      # docker run rather than `container:` on the job: the gitleaks image is
      # Alpine and cannot run the checkout action's glibc node binary inside
      # itself.
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner

      - name: Lint and format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test
        # ffmpeg so the probe tests exercise the real ffprobe path rather than
        # only the parser. Coverage table lands in the run log; thresholds
        # follow once main's baseline is visible.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          npm run test:coverage

  docker:
    # Publish builds on main; CI only needs to validate PR images.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Build only -- publishing is build.yml's job.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: podium:ci
          build-args: PODIUM_BUILD_VERSION=0.0.0-ci
          # Skips the attestation manifest, which otherwise shows up on the
          # packages page as an "unknown/unknown" platform entry.
          provenance: false
          # Export with Docker media types, not OCI ones: Unraid's Docker tab
          # fails to parse an OCI-typed manifest and shows the template as
          # "not available".
          outputs: type=image,oci-mediatypes=false
          # PRs read main's cache but never write it: every write replaces the
          # :buildcache tag and orphans the previous blobs for the registry's
          # GC to reap.
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:buildcache
