name: Build and Publish

# Publishes to the registry configured in this repo's Actions variables, so the
# hostname is not baked into a file that ships to the public mirror. Set:
#
#   REGISTRY    e.g. registry.example.com
#   IMAGE_NAME  e.g. you/podium
#
# Tagging matches .github/workflows/publish.yml on purpose:
#
#   push to main  -> :main                  an edge image, for tracking main
#   tag v*        -> :X.Y.Z :X.Y :latest    a release
#
# `latest` only moves on a tag, never on a push to main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # amd64 only: an arm64 pass costs a full QEMU-emulated Next.js build for a
  # platform nothing here runs. It also doubles both the image and the
  # :buildcache tag in the registry.
  DOCKER_PLATFORMS: linux/amd64

jobs:
  build-and-push:
    # ubuntu-latest, not `docker`: that label maps to a plain node image with no
    # docker CLI, so every buildx step fails on "docker: not found".
    # ubuntu-latest maps to catthehacker/ubuntu:act-22.04, which ships buildx.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Docker tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=podium
            org.opencontainers.image.description=Provider-aware stream checker and reorderer for Dispatcharr

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:buildcache,mode=max
